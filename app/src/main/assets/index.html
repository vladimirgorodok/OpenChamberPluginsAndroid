<title>OpenChamberPlugins</title>
<style>
  :root{--bg:#0b1020;--panel:#121a33;--panel2:#0c1226;--line:#29314d;--text:#e7edf7;--muted:#9ba4c4;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 24px}
  header{padding:16px 14px 6px}
  h1{margin:0 0 4px;font-size:19px;color:var(--accent)}
  .sub{color:var(--muted);font-size:12px}
  #search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;box-sizing:border-box}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .card .name{font-weight:650;color:var(--accent)}
  .card .title{color:var(--muted);font-size:13px;margin:2px 0 6px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .badge.installed{color:#86efac;border-color:#166534;background:#0c5c0c}
  .badge.type-plugin{color:#bfdbfe;border-color:#1e3a8a;background:#172554}
  .badge.type-mcp{color:#cffafe;border-color:#172554;background:#172554}
  .badge.type-addition{color:#bbf7d0;border-color:#0c5c0c;background:#08211a}
  .desc{margin:0 0 6px;font-size:13px;color:#e2e8f0}
  .cmd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;word-break:break-all;overflow:hidden}
  .empty{color:var(--muted);padding:20px;text-align:center}
  .log{padding:6px 14px;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel2)}
</style>
</head>

];const list = document.getElementById("list");
  const search = document.getElementById("search");
  const log = document.getElementById("log");

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;'}[c]));
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    list.innerHTML = "";
    const entries = CATALOG.filter(e => {
      if (!q) return true;
      const hay = (e.name + " " + e.title + " " + e.description + " " + (e.tags || []).join(" ") + " " + (e.category || "")).toLowerCase();
      return hay.includes(q);
    });
    if (entries.length === 0) {
      list.innerHTML = '<div class="empty">Ничего не найдено.</div>';
      return;
    }
    for (const e of entries) {
      const cmd = e.install || "";
      const notes = e.notes ? `<p class="desc">${escapeHtml(e.notes)}</p>` : "";
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="name">${escapeHtml(e.name)}</div>
        <div class="title">${escapeHtml(e.title || e.name)}</div>
        <div class="badges">
          <span class="badge type-${e.type}">${e.type}</span>
          ${e.installed ? '<span class="badge installed">Установлено</span>' : ''}
          ${e.category ? `<span class="badge">${escapeHtml(e.category)}</span>` : ''}
        </div>
        <p class="desc">${escapeHtml(e.description || "")}</p>
        ${cmd ? `<div class="cmd">${escapeHtml(cmd)}</div>` : ""}
        <button class="btn" data-cmd="${escapeHtml(cmd)}">Установить</button>
        ${notes}
      `;
      list.appendChild(card);
    }
    attach();
  }

  function attach() {
    for (const btn of document.querySelectorAll("#list .btn")) {
      if (btn.dataset.cmd !== undefined) {
        btn.addEventListener("click", () => runAsync(btn.dataset.cmd, "Установка: "));
      }
    }
  }

  function runAsync(cmd, label) {
    if (cmd) log.textContent = label + cmd + "\nВыполняю…";
    try {
      Android.runAsync(cmd);
    } catch (e) {
      log.textContent = (log.textContent || "") + "\nОшибка: " + (e && e.message ? e.message : e);
    }
  }

  function runSync(cmd) {
    try {
      const out = Android.run(cmd);
      return (out && out.trim()) ? out : "(нет вывода)";
    } catch (e) {
      return "Ошибка: " + (e && e.message ? e.message : e);
    }
  }

  // Результат асинхронной команды (MainActivity → window.onCommandResult)
  window.onCommandResult = function (json) {
    try {
      const j = JSON.parse(json);
      const out = (j.output || "").trim();
      log.textContent = (j.command ? j.command + "\n\n" : "") + (out || "(нет вывода)");
    } catch (_) {
      log.textContent = String(json);
    }
  };

  document.getElementById("check").addEventListener("click", () => {
    log.textContent = "Проверка установленных:\n" +
      runSync("opencode plugin list") + "\n\n" +
      runSync("opencode mcp list");
  });

  search.addEventListener("input", () => { setTimeout(render, 150); });
  render();
</script>
</body>
</html>
